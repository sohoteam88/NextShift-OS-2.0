name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Dependency Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Build App
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start App and Run E2E
        run: |
          pnpm start &
          npx wait-on http://localhost:3000/api/v1/health --timeout 30000
          pnpm e2e
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          E2E_BASE_URL: 'http://localhost:3000'

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
