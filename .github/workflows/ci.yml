name: CI

on:
  pull_request:
    branches: [main, develop, 'planning/**', 'release/**']
    paths-ignore:
      - 'docs/**'
      - 'audit/**'
      - '**/*.md'
      - 'platform/status.md'
  push:
    branches: [main, develop, 'planning/**']
    paths-ignore:
      - 'docs/**'
      - 'audit/**'
      - '**/*.md'
      - 'platform/status.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: '10.24.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Verify ESLint Boundaries
        run: pnpm lint:boundaries:check

      - name: Dependency Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: '10.24.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Run Packages Tests
        run: pnpm -r --filter './packages/*' test
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

  e2e-secrets:
    name: E2E Secret Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality, test]
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}

    steps:
      - name: Check E2E secrets
        id: check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          missing=()

          [[ -n "$NEXT_PUBLIC_SUPABASE_URL" ]] || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [[ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [[ -n "$E2E_TEST_USER_EMAIL" ]] || missing+=("E2E_TEST_USER_EMAIL")
          [[ -n "$E2E_TEST_USER_PASSWORD" ]] || missing+=("E2E_TEST_USER_PASSWORD")
          [[ -n "$E2E_ADMIN_EMAIL" ]] || missing+=("E2E_ADMIN_EMAIL")
          [[ -n "$E2E_ADMIN_PASSWORD" ]] || missing+=("E2E_ADMIN_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "E2E skipped: missing secrets" >> "$GITHUB_STEP_SUMMARY"
            printf 'Missing required E2E secrets:\n' >> "$GITHUB_STEP_SUMMARY"
            printf -- '- %s\n' "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          echo "E2E secrets present; E2E job will run." >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E Tests
    if: github.event_name == 'pull_request' && needs.e2e-secrets.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test, e2e-secrets]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: '10.24.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Ensure E2E Test Users
        run: pnpm tsx scripts/ensure-e2e-user.ts
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Build App
        run: pnpm build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          NEXT_PUBLIC_ENABLE_COMMAND_CENTER: 'true'
          NEXT_PUBLIC_ENABLE_AI_DISCUSSION: 'true'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start App and Run E2E
        run: |
          set -euo pipefail

          OFF_APP_PID=""
          ON_APP_PID=""
          stop_apps() {
            for pid in "$OFF_APP_PID" "$ON_APP_PID"; do
              if [[ -n "$pid" ]]; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap stop_apps EXIT

          NEXT_PUBLIC_ENABLE_COMMAND_CENTER=false ./node_modules/.bin/next start -p 3001 &
          OFF_APP_PID=$!
          npx wait-on http://localhost:3001/api/v1/health --timeout 30000
          NEXT_PUBLIC_ENABLE_COMMAND_CENTER=false E2E_BASE_URL=http://localhost:3001 npx playwright test tests/e2e/command-center.spec.ts --grep "flag off"

          NEXT_PUBLIC_ENABLE_COMMAND_CENTER=true NEXT_PUBLIC_ENABLE_AI_DISCUSSION=true ./node_modules/.bin/next start -p 3000 &
          ON_APP_PID=$!
          npx wait-on http://localhost:3000/api/v1/health --timeout 30000
          NEXT_PUBLIC_ENABLE_COMMAND_CENTER=true NEXT_PUBLIC_ENABLE_AI_DISCUSSION=true pnpm e2e
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
          E2E_BASE_URL: 'http://localhost:3000'

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
