name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Human-gated production action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

jobs:
  deploy:
    name: Deploy
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_BASE_DOMAIN="${{ secrets.PROD_NEXT_PUBLIC_BASE_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.PROD_NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.PROD_NEXT_PUBLIC_POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.PROD_NEXT_PUBLIC_POSTHOG_HOST }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_ENABLE_EVOLUTION_PROJECTION_V6="${{ vars.PROD_NEXT_PUBLIC_ENABLE_EVOLUTION_PROJECTION_V6 || 'false' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_REVENUE="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_REVENUE || 'true' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_ANALYTICS="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_ANALYTICS || 'true' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_MISSION="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_MISSION || 'false' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_BUSINESS_STATE="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_BUSINESS_STATE || 'false' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_CRM="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_CRM || 'false' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_COMMAND_CENTER="${{ vars.PROD_NEXT_PUBLIC_ENABLE_COMMAND_CENTER || 'false' }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.PROD_SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_ORG="${{ secrets.PROD_SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ secrets.PROD_SENTRY_PROJECT }}" \
            --build-arg NEXT_PUBLIC_COMMIT_SHA="$IMAGE_TAG" \
            --build-arg NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t nextshift-app:$IMAGE_TAG .
          docker save nextshift-app:$IMAGE_TAG | gzip > image.tar.gz

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'image.tar.gz,docker-compose.prod.yml,prisma,scripts/deploy-smoke.sh'
          target: '/home/deploy/nextshift'

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SUPABASE_SERVICE_ROLE_KEY
          script: |
            cd /home/deploy/nextshift
            test -n "$SUPABASE_SERVICE_ROLE_KEY"
            umask 077
            sed -i '/^SUPABASE_SERVICE_ROLE_KEY=/d' .env.production
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY" >> .env.production
            unset SUPABASE_SERVICE_ROLE_KEY
            if docker image inspect nextshift-app:latest >/dev/null 2>&1; then
              docker tag nextshift-app:latest nextshift-app:previous
            fi
            docker load < image.tar.gz
            docker tag nextshift-app:${{ env.IMAGE_TAG }} nextshift-app:latest
            docker run --rm \
              --env-file .env.production \
              -v "$PWD/prisma:/app/prisma:ro" \
              -w /app \
              node:22-alpine \
              sh -lc 'npx --yes prisma@6.19.3 migrate deploy --schema /app/prisma/schema.prisma'
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d app
            chmod +x scripts/deploy-smoke.sh
            BASE_URL=http://127.0.0.1:3000 scripts/deploy-smoke.sh
            docker image prune -f
            rm image.tar.gz

  rollback:
    name: Rollback to previous image
    if: ${{ inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/nextshift
            docker image inspect nextshift-app:previous >/dev/null 2>&1
            docker tag nextshift-app:previous nextshift-app:latest
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build app
            BASE_URL=http://127.0.0.1:3000 scripts/deploy-smoke.sh
