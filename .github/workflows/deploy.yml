name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/nextshift_os?schema=public
      DIRECT_URL: postgresql://user:password@127.0.0.1:5432/nextshift_os?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nextshift-app:${{ github.sha }} --target production .
          docker save nextshift-app:${{ github.sha }} | gzip > image.tar.gz

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "image.tar.gz,docker-compose.prod.yml"
          target: "/home/deploy/nextshift"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/nextshift
            docker load < image.tar.gz
            docker tag nextshift-app:${{ github.sha }} nextshift-app:latest
            docker compose -f docker-compose.prod.yml up -d app
            docker image prune -f
            rm image.tar.gz
