name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Production action"
        required: true
        type: choice
        options:
          - deploy
          - rollback
      release_sha:
        description: "Deploy: exact 40-character commit SHA in origin/main. Rollback: exact authorized nextshift-app image tag."
        required: true
        type: string
      confirmation:
        description: "DEPLOY_PRODUCTION or ROLLBACK_PRODUCTION, matching the selected action"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nextshift-production
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate manual production request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.request.outputs.release_sha }}
      control_plane_sha: ${{ steps.request.outputs.control_plane_sha }}
      rollback_image_id: ${{ steps.request.outputs.rollback_image_id }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate action, confirmation, and release SHA
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONTROL_PLANE_REF: ${{ github.ref }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/deployment/os39/validate-production-request.sh \
            "$ACTION" \
            "$CONFIRMATION" \
            "$RELEASE_SHA" \
            "$CONTROL_PLANE_REF" \
            "$CONTROL_PLANE_SHA"
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'control_plane_sha=%s\n' "$CONTROL_PLANE_SHA" >> "$GITHUB_OUTPUT"
          evidence='docs/nextshift-os-3/os-3-9/releases/OS39_PRODUCTION_READINESS_EVIDENCE.md'
          if [[ "$ACTION" == rollback ]]; then
            printf 'rollback_image_id=%s\n' \
              "$(grep -E '^ROLLBACK_IMAGE_ID=' "$evidence" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          fi

  build-migration-artifact:
    name: Build exact migration deployment artifact
    if: ${{ inputs.action == 'deploy' && inputs.confirmation == 'DEPLOY_PRODUCTION' }}
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ needs.validate-request.outputs.release_sha }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-request.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify exact release checkout
        run: test "$(git rev-parse HEAD)" = "$IMAGE_TAG"

      - name: Build and package one exact migration image
        run: |
          set -euo pipefail
          migration_image="nextshift-migrations:$IMAGE_TAG"
          docker build \
            --file scripts/deployment/Dockerfile.migrations \
            --build-arg RELEASE_SHA="$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$IMAGE_TAG" \
            --tag "$migration_image" \
            .
          migration_image_digest="$(docker image inspect --format '{{.Id}}' "$migration_image")"
          if [[ ! "$migration_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'ERROR: migration build image ID is invalid: actual=%s\n' "$migration_image_digest" >&2
            exit 1
          fi
          printf 'MIGRATION_RUNNER_IMAGE_ID=%s\n' "$migration_image_digest"
          migration_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$migration_image")"
          if [[ "$migration_revision" != "$IMAGE_TAG" ]]; then
            printf 'ERROR: migration build OCI revision mismatch: expected=%s actual=%s\n' \
              "$IMAGE_TAG" "$migration_revision" >&2
            exit 1
          fi
          scripts/deployment/validate-migration-image-runtime.sh "$migration_image" "$IMAGE_TAG"
          docker save "$migration_image" | gzip -n > migration-image.tar.gz
          printf '%s\n' "$migration_image_digest" > migration-image-digest.txt
          sha256sum migration-image.tar.gz > migration-image.tar.gz.sha256

      - name: Upload exact migration deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextshift-migration-${{ env.IMAGE_TAG }}
          path: |
            migration-image.tar.gz
            migration-image.tar.gz.sha256
            migration-image-digest.txt
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy exact release to production
    if: ${{ inputs.action == 'deploy' && inputs.confirmation == 'DEPLOY_PRODUCTION' }}
    needs: [validate-request, build-migration-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_PLANE_REF: ${{ github.ref }}
      CONTROL_PLANE_SHA: ${{ needs.validate-request.outputs.control_plane_sha }}
      IMAGE_TAG: ${{ needs.validate-request.outputs.release_sha }}

    steps:
      - name: Checkout exact production control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-request.outputs.control_plane_sha }}
          fetch-depth: 0

      - name: Revalidate control plane after environment wait
        run: |
          set -euo pipefail
          scripts/deployment/os39/validate-production-request.sh \
            "$ACTION" \
            "$CONFIRMATION" \
            "$IMAGE_TAG" \
            "$CONTROL_PLANE_REF" \
            "$CONTROL_PLANE_SHA"
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          readiness_evidence='docs/nextshift-os-3/os-3-9/releases/OS39_PRODUCTION_READINESS_EVIDENCE.md'
          cp "$readiness_evidence" "$RUNNER_TEMP/OS39_PRODUCTION_READINESS_EVIDENCE.md"
          install -m 700 \
            scripts/deployment/os39/validate-production-readiness-evidence.sh \
            "$RUNNER_TEMP/validate-os39-production-readiness-evidence.sh"
          "$RUNNER_TEMP/validate-os39-production-readiness-evidence.sh" \
            stage-1-3 \
            "$RUNNER_TEMP/OS39_PRODUCTION_READINESS_EVIDENCE.md"

      - name: Checkout exact release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-request.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify exact release checkout
        run: test "$(git rev-parse HEAD)" = "$IMAGE_TAG"

      - name: Build exact application image
        run: |
          set -euo pipefail
          docker build \
            --target production \
            --label "org.opencontainers.image.revision=$IMAGE_TAG" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_BASE_DOMAIN="${{ secrets.PROD_NEXT_PUBLIC_BASE_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.PROD_NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.PROD_NEXT_PUBLIC_POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.PROD_NEXT_PUBLIC_POSTHOG_HOST }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_ENABLE_EVOLUTION_PROJECTION_V6="${{ vars.PROD_NEXT_PUBLIC_ENABLE_EVOLUTION_PROJECTION_V6 || 'false' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_MISSION="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_MISSION || 'true' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_BUSINESS_STATE="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_BUSINESS_STATE || 'true' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_RUNTIME_CRM="${{ vars.PROD_NEXT_PUBLIC_ENABLE_RUNTIME_CRM || 'true' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_COMMAND_CENTER="${{ vars.PROD_NEXT_PUBLIC_ENABLE_COMMAND_CENTER || 'true' }}" \
            --build-arg NEXT_PUBLIC_ENABLE_AI_DISCUSSION="${{ vars.PROD_NEXT_PUBLIC_ENABLE_AI_DISCUSSION || 'false' }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.PROD_SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_ORG="${{ secrets.PROD_SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ secrets.PROD_SENTRY_PROJECT }}" \
            --build-arg NEXT_PUBLIC_COMMIT_SHA="$IMAGE_TAG" \
            --build-arg NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t nextshift-app:$IMAGE_TAG .
          docker save nextshift-app:$IMAGE_TAG | gzip -n > image.tar.gz
          printf '%s\n' "$IMAGE_TAG" > os38-release-sha.txt

      - name: Download exact migration deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nextshift-migration-${{ env.IMAGE_TAG }}
          path: .

      - name: Configure pinned OpenSSH transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/id"
          chmod 600 "$RUNNER_TEMP/id"
          printf '%s\n' '185.227.134.164 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIKhgmUzZdSo3SCuPWRHs1cyJhRCWsmQyawavkFyQ0hw' > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"

      - name: Copy exact release artifacts to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/id"
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts"
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_options[@]}" "deploy@$VPS_HOST" \
            'install -d -m 775 /home/deploy/nextshift/scripts'
          scp -O "${ssh_options[@]}" \
            image.tar.gz \
            migration-image.tar.gz \
            migration-image.tar.gz.sha256 \
            migration-image-digest.txt \
            docker-compose.prod.yml \
            os38-release-sha.txt \
            "deploy@$VPS_HOST:/home/deploy/nextshift/"
          scp -O "${ssh_options[@]}" \
            scripts/deploy-smoke.sh \
            "deploy@$VPS_HOST:/home/deploy/nextshift/scripts/deploy-smoke.sh"

      - name: Migrate and deploy exact release SHA
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/id" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" 'bash -euo pipefail -s' <<'REMOTE_SCRIPT'
            set -euo pipefail

            fail_check() {
              local check_name="$1" expected="$2" actual="$3"
              printf 'ERROR: %s failed: expected=%s actual=%s\n' \
                "$check_name" "$expected" "$actual" >&2
              exit 1
            }

            assert_equal() {
              local check_name="$1" expected="$2" actual="$3"
              [[ "$actual" == "$expected" ]] || fail_check "$check_name" "$expected" "$actual"
            }

            assert_sha256() {
              local check_name="$1" actual="$2"
              [[ "$actual" =~ ^sha256:[0-9a-f]{64}$ ]] || \
                fail_check "$check_name" 'sha256:<64 lowercase hex>' "$actual"
            }

            require_image() {
              local check_name="$1" image="$2"
              docker image inspect "$image" >/dev/null 2>&1 || \
                fail_check "$check_name" "present image $image" 'absent'
            }

            cd /home/deploy/nextshift
            if docker image inspect nextshift-app:latest >/dev/null 2>&1; then
              docker tag nextshift-app:latest nextshift-app:previous
            fi
            docker load < image.tar.gz
            require_image 'application image after archive load' nextshift-app:${{ env.IMAGE_TAG }}
            image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' nextshift-app:${{ env.IMAGE_TAG }})"
            assert_equal 'application OCI revision' "${{ env.IMAGE_TAG }}" "$image_revision"
            if ! sha256sum --check migration-image.tar.gz.sha256; then
              fail_check 'migration archive checksum' 'matching SHA-256 manifest' 'mismatch'
            fi
            expected_migration_digest="$(cat migration-image-digest.txt)"
            assert_sha256 'migration artifact recorded image ID' "$expected_migration_digest"
            migration_tar_config="$(tar -xzOf migration-image.tar.gz manifest.json | jq -r '.[0].Config')"
            [[ "$migration_tar_config" =~ ^blobs/sha256/[0-9a-f]{64}$ ]] || \
              fail_check 'migration artifact Config path' 'blobs/sha256/<64 lowercase hex>' "$migration_tar_config"
            migration_tar_config_digest="sha256:$(tar -xzOf migration-image.tar.gz "$migration_tar_config" | sha256sum | awk '{print $1}')"
            assert_sha256 'migration artifact Config digest' "$migration_tar_config_digest"
            assert_equal 'migration artifact config digest' "$expected_migration_digest" "$migration_tar_config_digest"
            printf 'MIGRATION_VPS_ARTIFACT_CONFIG_DIGEST=%s\n' "$migration_tar_config_digest"
            docker load < migration-image.tar.gz
            migration_image="nextshift-migrations:${{ env.IMAGE_TAG }}"
            require_image 'migration image after archive load' "$migration_image"
            migration_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$migration_image")"
            assert_equal 'migration OCI revision' "${{ env.IMAGE_TAG }}" "$migration_revision"
            assert_equal 'migration Prisma label' '6.19.3' \
              "$(docker image inspect --format '{{ index .Config.Labels "com.nextshift.migration.prisma" }}' "$migration_image")"
            assert_equal 'migration Bash label' '5.3.9-r1' \
              "$(docker image inspect --format '{{ index .Config.Labels "com.nextshift.migration.bash" }}' "$migration_image")"
            assert_equal 'migration psql label' '17.10-r0' \
              "$(docker image inspect --format '{{ index .Config.Labels "com.nextshift.migration.psql" }}' "$migration_image")"
            assert_equal 'migration entrypoint' '["/usr/bin/env","bash","/app/scripts/deployment/run-os38-production-migrations.sh"]' \
              "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$migration_image")"
            docker run --rm --network none --entrypoint bash "$migration_image" -ceu '
              assert_equal() {
                local check_name="$1" expected="$2" actual="$3"
                [[ "$actual" == "$expected" ]] || {
                  printf "ERROR: %s failed: expected=%s actual=%s\\n" "$check_name" "$expected" "$actual" >&2
                  exit 1
                }
              }
              assert_equal "migration runtime Bash package" "bash-5.3.9-r1" "$(apk info -v | grep -Fx "bash-5.3.9-r1" || true)"
              assert_equal "migration runtime psql package" "postgresql17-client-17.10-r0" "$(apk info -v | grep -Fx "postgresql17-client-17.10-r0" || true)"
              assert_equal "migration runtime psql version" "psql (PostgreSQL) 17.10" "$(psql --version)"
            '
            if ! docker run --rm \
              --env-file .env.production \
              -e OS38_MIGRATION_MODE=production \
              -v "$PWD/os38-release-sha.txt:/run/nextshift/os38-release-sha.txt:ro" \
              "$migration_image" \
              "${{ env.IMAGE_TAG }}" \
              /run/nextshift/os38-release-sha.txt; then
              fail_check 'migration container exit status' '0' 'non-zero'
            fi
            docker tag nextshift-app:${{ env.IMAGE_TAG }} nextshift-app:latest
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d app
            chmod +x scripts/deploy-smoke.sh
            BASE_URL=http://127.0.0.1:3000 scripts/deploy-smoke.sh
            docker image prune -f
            rm image.tar.gz migration-image.tar.gz migration-image.tar.gz.sha256 migration-image-digest.txt
          REMOTE_SCRIPT

      - name: Remove temporary OpenSSH key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/id"

  rollback:
    name: Roll back production to exact release SHA
    if: ${{ inputs.action == 'rollback' && inputs.confirmation == 'ROLLBACK_PRODUCTION' }}
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_PLANE_REF: ${{ github.ref }}
      CONTROL_PLANE_SHA: ${{ needs.validate-request.outputs.control_plane_sha }}
      ROLLBACK_IMAGE_TAG: ${{ needs.validate-request.outputs.release_sha }}
      ROLLBACK_IMAGE_ID: ${{ needs.validate-request.outputs.rollback_image_id }}
    steps:
      - name: Checkout exact production control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-request.outputs.control_plane_sha }}
          fetch-depth: 0

      - name: Revalidate control plane after environment wait
        run: |
          set -euo pipefail
          scripts/deployment/os39/validate-production-request.sh \
            "$ACTION" \
            "$CONFIRMATION" \
            "$ROLLBACK_IMAGE_TAG" \
            "$CONTROL_PLANE_REF" \
            "$CONTROL_PLANE_SHA"
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"

      - name: Configure pinned OpenSSH transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/id"
          chmod 600 "$RUNNER_TEMP/id"
          printf '%s\n' '185.227.134.164 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIKhgmUzZdSo3SCuPWRHs1cyJhRCWsmQyawavkFyQ0hw' > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"

      - name: Rollback on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/id" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" 'bash -euo pipefail -s' <<'REMOTE_SCRIPT'
            cd /home/deploy/nextshift
            target_image="${{ env.ROLLBACK_IMAGE_TAG }}"
            docker image inspect "$target_image" >/dev/null 2>&1
            image_id="$(docker image inspect --format '{{.Id}}' "$target_image")"
            test "$image_id" = "${{ env.ROLLBACK_IMAGE_ID }}"
            docker tag "$target_image" nextshift-app:latest
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build app
            BASE_URL=http://127.0.0.1:3000 scripts/deploy-smoke.sh
          REMOTE_SCRIPT

      - name: Remove temporary OpenSSH key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/id"
