name: Deploy to Production

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nextshift-app:${{ github.sha }} --target production .
          docker save nextshift-app:${{ github.sha }} | gzip > image.tar.gz

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'image.tar.gz,docker-compose.prod.yml'
          target: '/home/deploy/nextshift'

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/nextshift
            docker load < image.tar.gz
            docker tag nextshift-app:${{ github.sha }} nextshift-app:latest
            docker compose -f docker-compose.prod.yml up -d app
            docker image prune -f
            rm image.tar.gz

  rollback:
    name: Rollback (manual)
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rollback notification
        run: |
          echo "CI failed on main. Deployment was NOT triggered."
          echo "Investigate the CI failure: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
